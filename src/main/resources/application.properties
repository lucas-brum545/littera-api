spring.application.name=api
server.port=${PORT:8080}

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/littera}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:lucas}

api.security.token.secret=${JWT_SECRET:my-secret-key}

app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.springframework.web=DEBUG

spring.flyway.enabled=true
logging.level.org.flywaydb=DEBUG
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
spring.flyway.locations=classpath:db/migration
